<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16A34A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Prospera Order</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"></noscript>
</head>
<body>
  <header>
    <div class="hdr-lateral esq">
      <button class="icon-btn" id="btnVoltar" hidden onclick="App.go('home')">←</button>
    </div>
    <div class="marca">
      <h1 id="titulo" class="logo-texto">PRO<span class="logo-verde">SPERA</span> ORDER</h1>
      <small id="subtitulo">Início</small>
    </div>
    <div class="hdr-lateral dir">
      <button class="icon-btn" onclick="App.go('ajustes')">⚙</button>
    </div>
  </header>

  <main id="view"></main>

  <button class="fab" id="btnCalc" aria-label="Abrir calculadora" onclick="Calculadora.alternar()">🧮</button>

  <nav class="tabbar">
    <button data-view="home" onclick="App.go('home')"><span class="ico">🏠</span>Início</button>
    <button data-view="diaria" onclick="App.go('diaria')"><span class="ico">📦</span>Diária</button>
    <button data-view="clientes" onclick="App.go('clientes')"><span class="ico">🏪</span>Clientes</button>
    <button data-view="produtos" onclick="App.go('produtos')"><span class="ico">🛒</span>Produtos</button>
    <button data-view="relatorios" onclick="App.go('relatorios')"><span class="ico">📊</span>Relatórios</button>
  </nav>

  <dialog id="dlg"></dialog>
  <div class="toast" id="toast"></div>

  <script src="js/vendor/dexie.min.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/calculadora.js"></script>
  <script src="js/util.js"></script>
  <script src="js/db.js"></script>
  <script src="js/reports.js"></script>
  <script src="js/backup.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
